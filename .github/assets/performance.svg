<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
  <defs>
    <linearGradient id="perfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <text x="300" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="2">START TIME (ms) — LOWER IS BETTER</text>
  <!-- Grid lines -->
  <line x1="80" y1="30" x2="80" y2="160" stroke="#1e293b" stroke-width="1"/>
  <line x1="80" y1="160" x2="580" y2="160" stroke="#1e293b" stroke-width="1"/>
  <!-- Doki -->
  <text x="10" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#e0e7ff" font-weight="600">Doki</text>
  <rect x="80" y="40" width="8" height="16" rx="2" fill="url(#perfGrad)">
    <animate attributeName="width" from="0" to="8" dur="0.8s" fill="freeze"/>
  </rect>
  <text x="95" y="50" font-family="monospace" font-size="9" fill="#818cf8">&lt;15ms</text>
  <!-- Alpine -->
  <text x="10" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">alpine</text>
  <rect x="80" y="60" width="10" height="16" rx="2" fill="url(#perfGrad)" opacity="0.7">
    <animate attributeName="width" from="0" to="10" dur="0.8s" fill="freeze" begin="0.1s"/>
  </rect>
  <text x="95" y="70" font-family="monospace" font-size="9" fill="#64748b">10ms</text>
  <!-- Python -->
  <text x="10" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">python</text>
  <rect x="80" y="80" width="4" height="16" rx="2" fill="url(#perfGrad)" opacity="0.7">
    <animate attributeName="width" from="0" to="4" dur="0.8s" fill="freeze" begin="0.2s"/>
  </rect>
  <text x="95" y="90" font-family="monospace" font-size="9" fill="#64748b">4ms</text>
  <!-- Redis -->
  <text x="10" y="110" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">redis</text>
  <rect x="80" y="100" width="6" height="16" rx="2" fill="url(#perfGrad)" opacity="0.7">
    <animate attributeName="width" from="0" to="6" dur="0.8s" fill="freeze" begin="0.3s"/>
  </rect>
  <text x="95" y="110" font-family="monospace" font-size="9" fill="#64748b">6ms</text>
  <!-- Nginx -->
  <text x="10" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">nginx</text>
  <rect x="80" y="120" width="12" height="16" rx="2" fill="url(#perfGrad)" opacity="0.7">
    <animate attributeName="width" from="0" to="12" dur="0.8s" fill="freeze" begin="0.4s"/>
  </rect>
  <text x="95" y="130" font-family="monospace" font-size="9" fill="#64748b">12ms</text>
  <!-- Node -->
  <text x="10" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">node</text>
  <rect x="80" y="140" width="15" height="16" rx="2" fill="url(#perfGrad)" opacity="0.7">
    <animate attributeName="width" from="0" to="15" dur="0.8s" fill="freeze" begin="0.5s"/>
  </rect>
  <text x="95" y="150" font-family="monospace" font-size="9" fill="#64748b">15ms</text>
  <!-- Right side stats -->
  <text x="300" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">mariadb</text>
  <rect x="380" y="40" width="20" height="16" rx="2" fill="url(#perfGrad)" opacity="0.5">
    <animate attributeName="width" from="0" to="20" dur="0.8s" fill="freeze" begin="0.6s"/>
  </rect>
  <text x="405" y="50" font-family="monospace" font-size="9" fill="#64748b">20ms</text>
  <text x="300" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">nextcloud</text>
  <rect x="380" y="60" width="45" height="16" rx="2" fill="url(#perfGrad)" opacity="0.5">
    <animate attributeName="width" from="0" to="45" dur="0.8s" fill="freeze" begin="0.7s"/>
  </rect>
  <text x="430" y="70" font-family="monospace" font-size="9" fill="#64748b">45ms</text>
  <!-- Highlight box -->
  <rect x="300" y="90" width="280" height="70" rx="8" fill="#0f0f23" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff" font-weight="600">4x smaller than Docker</text>
  <text x="440" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff" font-weight="600">7x less memory</text>
  <text x="440" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff" font-weight="600">Zero dependencies</text>
</svg>
