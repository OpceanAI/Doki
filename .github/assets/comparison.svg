<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <text x="300" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="2">BINARY SIZE COMPARISON</text>
  <!-- Doki bar -->
  <text x="10" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff" font-weight="600">Doki</text>
  <rect x="80" y="28" width="65" height="16" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="65" dur="1s" fill="freeze"/>
  </rect>
  <text x="150" y="40" font-family="monospace" font-size="10" fill="#818cf8">13 MB</text>
  <!-- Docker bar -->
  <text x="10" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Docker</text>
  <rect x="80" y="50" width="290" height="16" rx="3" fill="url(#grayGrad)" opacity="0.5">
    <animate attributeName="width" from="0" to="290" dur="1s" fill="freeze" begin="0.2s"/>
  </rect>
  <text x="375" y="62" font-family="monospace" font-size="10" fill="#6b7280">58 MB</text>
  <!-- Podman bar -->
  <text x="10" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Podman</text>
  <rect x="80" y="72" width="225" height="16" rx="3" fill="url(#grayGrad)" opacity="0.5">
    <animate attributeName="width" from="0" to="225" dur="1s" fill="freeze" begin="0.4s"/>
  </rect>
  <text x="310" y="84" font-family="monospace" font-size="10" fill="#6b7280">45 MB</text>
  <!-- containerd bar -->
  <text x="10" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">containerd</text>
  <rect x="80" y="94" width="210" height="16" rx="3" fill="url(#grayGrad)" opacity="0.5">
    <animate attributeName="width" from="0" to="210" dur="1s" fill="freeze" begin="0.6s"/>
  </rect>
  <text x="295" y="106" font-family="monospace" font-size="10" fill="#6b7280">42 MB</text>
</svg>
