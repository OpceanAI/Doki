<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50" viewBox="0 0 600 50">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Platform badges with hover-like pulse -->
  <g transform="translate(30, 10)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">Linux</text>
  </g>
  <g transform="translate(120, 10)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">macOS</text>
  </g>
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">Android</text>
  </g>
  <g transform="translate(300, 10)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">Termux</text>
  </g>
  <g transform="translate(390, 10)">
    <rect x="0" y="0" width="90" height="30" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="2s"/>
    </rect>
    <text x="45" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">Rootless</text>
  </g>
  <g transform="translate(490, 10)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="2.5s"/>
    </rect>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">CRI</text>
  </g>
</svg>
