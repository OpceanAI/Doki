global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'doki-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: /metrics

  - job_name: 'doki-redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
