# Doki Compose — Stack completo de prueba
# Incluye: web, api, db, redis, worker, nginx reverse proxy
version: "3.10"

services:
  # ============================================================
  # Base de datos PostgreSQL
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpass123
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ============================================================
  # Cache Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: test-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # API Backend (Node.js)
  # ============================================================
  api:
    build:
      context: .
      dokifile: Dokifile
    image: test-api:latest
    container_name: test-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://admin:secretpass123@db:5432/testdb
      REDIS_URL: redis://redis:6379
      API_SECRET: my-secret-key
    ports:
      - "3000:3000"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # Web Frontend (estatico)
  # ============================================================
  web:
    image: nginx:alpine
    container_name: test-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ============================================================
  # Worker background (Celery/Bull)
  # ============================================================
  worker:
    build:
      context: .
      dokifile: Dokifile
    image: test-api:latest
    container_name: test-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://admin:secretpass123@db:5432/testdb
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 4
    command: ["node", "worker.js"]
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"

  # ============================================================
  # Prometheus monitoring
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: test-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend
      - monitoring

  # ============================================================
  # Grafana dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: test-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring

# ============================================================
# Networks
# ============================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

# ============================================================
# Volumes
# ============================================================
volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
