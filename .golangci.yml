run:
  timeout: 5m
  build-tags:
    - android
    - linux

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - gofmt
    - goimports
    - gosec
    - misspell
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - whitespace
  disable:
    - depguard
    - gocognit
    - cyclop
    - funlen
    - lll
    - nestif
    - wrapcheck

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104 # Duplicate of errcheck
      - G304 # File path inclusion is expected
      - G404 # Use of math/rand is acceptable
  govet:
    enable-all: true
    disable:
      - fieldalignment
  misspell:
    locale: US
  goimports:
    local-prefixes: github.com/OpceanAI/Doki

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-dirs:
    - vendor
    - releases
    - distros
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
    - path: cmd/dokid/main.go
      linters:
        - errcheck
    - path: pkg/api/server.go
      linters:
        - errcheck
        - gosec
    - text: "SA1019"
      linters:
        - staticcheck
    - text: "G107"
      linters:
        - gosec
