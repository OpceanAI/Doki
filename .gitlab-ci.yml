stages:
  - build
  - test
  - lint
  - release

variables:
  GO_VERSION: "1.26.3"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"

.go_template: &go_definition
  image: golang:${GO_VERSION}
  before_script:
    - go version
    - go env
    - go mod download
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/

build:release:
  <<: *go_definition
  stage: build
  script:
    - make build-release sha256
  artifacts:
    paths:
      - releases/
    expire_in: 1 week
  tags:
    - docker

test:
  <<: *go_definition
  stage: test
  script:
    - go test ./... -v -race -coverprofile=coverage.out
    - go tool cover -func=coverage.out
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
    when: always
  after_script:
    - go install github.com/boumenot/gocover-cobertura@v1.4.0
    - gocover-cobertura < coverage.out > coverage.xml || true
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

lint:
  image: golangci/golangci-lint:v2.4.0
  stage: lint
  script:
    - golangci-lint run ./...

vet:
  <<: *go_definition
  stage: lint
  script:
    - go vet ./...

release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs:
    - job: build:release
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Doki $CI_COMMIT_TAG release"
    assets:
      links:
        - name: "Release artifacts"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/releases?job=build:release"
